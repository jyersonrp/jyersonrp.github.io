    <!-- Immediate Theme & Palette Initialization to eliminate FOUC -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('portfolio_theme_mode');
          if (mode === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          var palette = localStorage.getItem('portfolio_color_palette');
          if (palette !== 'emerald' && palette !== 'ultraviolet' && palette !== 'amber') {
            palette = 'emerald';
          }
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
